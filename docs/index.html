<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horde Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0a12">
<meta name="description" content="Mobile AI roleplay studio: characters, persistent worlds, memories.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ APP BAR ============ -->
<header id="appbar" class="appbar">
  <button id="btn-back" class="icon-btn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="appbar-title">
    <span id="bar-title">Horde Studio</span>
    <span id="bar-sub" class="appbar-sub"></span>
  </div>
  <button id="btn-bar-action" class="icon-btn" aria-label="More" hidden>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
  </button>
</header>

<!-- ============ VIEWS ============ -->
<main id="view" class="view">

  <!-- ---------- CHARACTERS ---------- -->
  <section class="screen" data-screen="characters">
    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="char-search" type="search" placeholder="Search characters…" autocomplete="off">
      </div>
      <button id="btn-add-char" class="fab-mini" aria-label="New character">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="tag-bar" class="tag-bar"></div>
    <div id="char-grid" class="char-grid"></div>
    <div id="char-empty" class="empty" hidden>
      <div class="empty-art">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 21a8 8 0 0116 0"/></svg>
      </div>
      <h3>No characters yet</h3>
      <p>Build one yourself, or import a SillyTavern card (JSON or PNG).</p>
      <div class="row-gap">
        <button class="btn primary" data-act="new-char">Create character</button>
        <button class="btn" data-act="import-card">Import card</button>
      </div>
    </div>
  </section>

  <!-- ---------- NOW / VIRTUAL HUMANS ---------- -->
  <section class="screen" data-screen="life" hidden>
    <div id="now-body"></div>
  </section>

  <!-- ---------- FEED ---------- -->
  <section class="screen" data-screen="feed" hidden>
    <div id="feed-body"></div>
  </section>

  <!-- ---------- CHATS ---------- -->
  <section class="screen" data-screen="chats" hidden>
    <div id="chat-list" class="list"></div>
    <div id="chats-empty" class="empty" hidden>
      <div class="empty-art">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H8l-5 3 1.5-4.5A8 8 0 1121 12z"/></svg>
      </div>
      <h3>No conversations</h3>
      <p>Pick a character from the Cast tab and hit <b>Chat</b>.</p>
    </div>
  </section>

  <!-- ---------- WORLD / MEMORY ---------- -->
  <section class="screen" data-screen="world" hidden>
    <div id="world-body"></div>
  </section>

  <!-- ---------- SETTINGS ---------- -->
  <section class="screen" data-screen="settings" hidden>
    <div id="settings-body" class="settings"></div>
  </section>

  <!-- ---------- CHAT THREAD ---------- -->
  <section class="screen screen-chat" data-screen="chat" hidden>
    <div id="thread" class="thread"></div>
    <div id="typing" class="typing" hidden><span></span><span></span><span></span></div>
    <div id="gen-banner" class="gen-banner" hidden></div>
    <div class="composer">
      <button id="btn-img" class="icon-btn ghost" aria-label="Generate image" title="Generate an image with AI Horde">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
      <button id="btn-send" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg>
      </button>
    </div>
  </section>

  <!-- ---------- CHARACTER EDITOR ---------- -->
  <section class="screen" data-screen="editor" hidden>
    <div id="editor-body" class="settings"></div>
  </section>

</main>

<!-- ============ BOTTOM NAV ============ -->
<nav id="nav" class="nav">
  <button class="nav-btn active" data-go="characters">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.9"/></svg>
    <span>Cast</span>
  </button>
  <button class="nav-btn" data-go="life">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Life</span>
  </button>
  <button class="nav-btn" data-go="chats">
    <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H8l-5 3 1.5-4.5A8 8 0 1121 12z"/></svg>
    <span>Chats</span>
  </button>
  <button class="nav-btn" data-go="world">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 010 18a15 15 0 010-18z"/></svg>
    <span>World</span>
  </button>
  <button class="nav-btn" data-go="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.9 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 14.6H3a2 2 0 110-4h.1A1.6 1.6 0 004.7 7.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- ============ SHEET / MODAL ============ -->
<div id="sheet-wrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-body" class="sheet-body"></div>
    <div id="sheet-actions" class="sheet-actions"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="boot" class="boot">
  <img src="icons/icon-192.png" alt="" width="88" height="88">
  <div class="boot-name">Horde Studio</div>
  <div class="boot-sub">Mobile</div>
</div>

<script src="js/idb.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/horde.js"></script>
<script src="js/worlds.js"></script>
<script src="js/vhuman.js"></script>
<script src="js/views.js"></script>
<script src="js/update.js"></script>
<script src="js/app.js"></script>
</body>
</html>
